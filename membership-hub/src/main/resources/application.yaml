# Runtime configuration for the Membership Hub. Values here are the defaults baked into
# the image; the local-development defaults point at a VE exposed on cxve.localhost.
#
# Every key can be overridden from outside without rebuilding, e.g. from a Kubernetes ConfigMap:
#   - as environment variables (env/envFrom): the exact variable name is noted next to each key
#   - or by mounting a yaml file and pointing SPRING_CONFIG_ADDITIONALLOCATION at it
#     (spring.config.additional-location=/path/to/dir/)

spring:
  application:
    name: membership-hub                                        # SPRING_APPLICATION_NAME
  # Postgres persistence for membership records (JpaMembershipRepository) is the DEFAULT.
  # Startup requires a reachable database; run with SPRING_PROFILES_ACTIVE=test (the profile
  # document at the bottom of this file) to fall back to the in-memory store instead — no
  # database needed, state lost on restart.
  datasource:
    url: jdbc:postgresql://localhost:5432/membershiphub         # SPRING_DATASOURCE_URL
    username: membershiphub                                     # SPRING_DATASOURCE_USERNAME
    password: membershiphub                                     # SPRING_DATASOURCE_PASSWORD
  jpa:
    hibernate:
      # Hibernate manages the schema; move to `validate` once it is migration-managed.
      ddl-auto: update                                          # SPRING_JPA_HIBERNATE_DDLAUTO
    open-in-view: false
  # Bearer-JWT validation on /api/callbacks/** against the VE's OSP IdP, Ory Hydra
  # (CallbackSecurityConfig): the dataspaces' onboarding APIs authenticate their status callbacks
  # with the client this app registers alongside its callback URL. The JWKS is fetched lazily on
  # the first request, so startup does not need the IdP to be reachable. issuer-uri is the expected
  # `iss` value — Hydra's urls.self.issuer, the EXTERNAL gateway URL; with jwk-set-uri also set,
  # Boot performs no discovery against it.
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://cx-ve-osp-idp.edc-v.svc.cluster.local:4444/.well-known/jwks.json  # SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI
          issuer-uri: http://cxve.localhost/auth/osp                                      # SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUERURI

springdoc:
  swagger-ui:
    path: /swagger                                              # SPRINGDOC_SWAGGERUI_PATH

logging:
  level:
    com.metaform.cxve.hub: INFO                                 # LOGGING_LEVEL_COM_METAFORM_CXVE_HUB

# The dataspaces members can be onboarded into, keyed by dataspace id — the `dataspace` of a
# member request. Only `enabled` ones are served (GET /api/dataspaces lists them); each needs a
# DataspaceOnboarding implementation in the hub (see DataspacesConfig).
#
# onboarding: the dataspace's onboarding API, called in the onboarding-service-provider role —
#   OAuth2 client-credentials (auth) against the VE's OSP IdP (Ory Hydra); the client must be
#   seeded there (see the umbrella chart's ospIdp.clients). The callback block is what the hub
#   registers as its status-callback address: the url must be reachable FROM the onboarding API
#   and end in /api/callbacks/<dataspace id>/registration-status, and token-url/client-id/
#   client-secret are the credentials it authenticates its callback calls with (a second seeded
#   Hydra client) — this app's callback endpoint validates the resulting bearer.
# dataspace-profiles: the DSP dataspace profiles a hosted member's connector is deployed with.
# member-id-claim: where data-plane flow tokens take the caller's member id from — the `claim` of
#   its `credential-type` credential, stamped into the token as `flow-claim` (certo requires it).
dataspaces:
  catena-x:
    enabled: true                                               # DATASPACES_CATENAX_ENABLED
    display-name: Catena-X
    onboarding:
      url: http://cxve.localhost/cx-onboarding                  # DATASPACES_CATENAX_ONBOARDING_URL
      callback:
        url: http://localhost:8080/api/callbacks/catena-x/registration-status  # DATASPACES_CATENAX_ONBOARDING_CALLBACK_URL
        token-url: http://cxve.localhost/auth/osp/oauth2/token
        client-id: membership-hub-callback
        client-secret: ""                                       # DATASPACES_CATENAX_ONBOARDING_CALLBACK_CLIENTSECRET
      auth:
        token-url: http://cxve.localhost/auth/osp/oauth2/token
        client-id: membership-hub
        client-secret: ""                                       # DATASPACES_CATENAX_ONBOARDING_AUTH_CLIENTSECRET
        scope: configure_partner_registration
    dataspace-profiles:
      - cx-neptune
    member-id-claim:
      credential-type: BpnCredential
      claim: bpn
      flow-claim: bpn
  # Decade-X, through the VE's dx-onboarding-api stub — which approves applications but issues no
  # credentials (there is no Decade-X issuer on the platform yet).
  decade-x:
    enabled: true                                               # DATASPACES_DECADEX_ENABLED
    display-name: Decade-X
    onboarding:
      url: http://cxve.localhost/dx-onboarding                  # DATASPACES_DECADEX_ONBOARDING_URL
      callback:
        url: http://localhost:8080/api/callbacks/decade-x/registration-status  # DATASPACES_DECADEX_ONBOARDING_CALLBACK_URL
        token-url: http://cxve.localhost/auth/osp/oauth2/token
        client-id: membership-hub-callback
        client-secret: ""                                       # DATASPACES_DECADEX_ONBOARDING_CALLBACK_CLIENTSECRET
      auth:
        token-url: http://cxve.localhost/auth/osp/oauth2/token
        client-id: membership-hub
        client-secret: ""                                       # DATASPACES_DECADEX_ONBOARDING_AUTH_CLIENTSECRET
        scope: ""
    # Catena-X's DSP profile, for now: the platform advertises ONE profile in every participant's
    # DID document, and cx-neptune is the only one registered.
    dataspace-profiles:
      - cx-neptune
    member-id-claim:
      credential-type: DecadeXMembershipCredential
      claim: decadeXId
      flow-claim: bpn

# The CFM Tenant Manager, where the member's EDC resources are provisioned. token-resource is the
# jwtlet mapping (RFC 8693 `resource`) the workload token is exchanged under; its scopes must
# include tenant-manager-api:read/write (the chart's jwtlet-seed job registers it).
# Not used for externally hosted members — nothing is provisioned for those.
tenant-manager:
  url: http://cxve.localhost/api/tm                              # TENANT_MANAGER_URL
  token-resource: issuer                                        # TENANT_MANAGER_TOKEN_RESOURCE

# Token exchange (RFC 8693): workload token file + exchange endpoint
token:
  # user.dir = the process working directory (same as $PWD in a shell, but also resolvable in
  # containers, where no shell sets PWD). In Kubernetes point this at the projected token,
  # e.g. /var/run/secrets/jwtlet/token.
  file:
    path: "${user.dir}/token"                                   # TOKEN_FILE_PATH
  exchange:
    url: http://cxve.localhost/api/auth                          # TOKEN_EXCHANGE_URL
    audience: edcv                                              # TOKEN_EXCHANGE_AUDIENCE

# Prefix for participant DIDs when the membership request doesn't supply one; the member's short
# name is appended. Must match the platform's IdentityHub did:web hostname (identity.<host>) AND
# the Onboarding API's template — the hub always sends the resolved DID explicitly, so the two
# sides cannot drift, but a template pointing at the wrong authority would still mint a DID that
# does not resolve.
participant:
  did:
    template: "did:web:identity.cxve.localhost:"   # PARTICIPANT_DID_TEMPLATE
  # How long the provisioning worker waits for a deployed participant profile to report its
  # participant context id before failing the membership. The wait exists because the credential
  # offer that follows needs the member's wallet and DID document to be there — the Tenant Manager
  # reports progress only when asked, so the worker polls it.
  provisioning:
    timeout: 10m                                                # PARTICIPANT_PROVISIONING_TIMEOUT
    poll-interval: 5s                                           # PARTICIPANT_PROVISIONING_POLLINTERVAL
  # Transfer-type mapping configured on the member's data plane (Siglet) at provisioning time,
  # via the cfm.dataplane VPA properties. The CFM siglet agent installs the mapping and registers
  # the data-plane instance with the control plane; the mapping key (transfer-type) becomes the
  # catalog distribution format of the member's assets. An empty endpoint disables data-plane
  # registration entirely (provisioning still succeeds, but no transfers are possible).
  # Both types are the Data Plane Signaling HTTP transfer profile's pull value
  # (https://eclipse-dataplane-signaling.github.io/profiles/HEAD/#transfer-profiles): the
  # transfer type IS the profile value, and the DataAddress endpointType MUST be that same value.
  dataplane:
    transfer-type: https://w3id.org/dspace-sig/profile/http-pull  # PARTICIPANT_DATAPLANE_TRANSFERTYPE
    endpoint-type: https://w3id.org/dspace-sig/profile/http-pull  # PARTICIPANT_DATAPLANE_ENDPOINTTYPE
    endpoint: ""                                                # PARTICIPANT_DATAPLANE_ENDPOINT
    token-source: provider                                      # PARTICIPANT_DATAPLANE_TOKENSOURCE
  # Second transfer-type mapping, pointing at Certo's CCM protocol API (the CCM use case's
  # certificate exchange, CX-0135 in Catena-X). Same semantics as `dataplane` above: an empty
  # endpoint leaves the mapping out.
  ccm:
    transfer-type: https://w3id.org/dspace-sig/profile/http-pull  # PARTICIPANT_CCM_TRANSFERTYPE
    endpoint-type: https://w3id.org/dspace-sig/profile/http-pull  # PARTICIPANT_CCM_ENDPOINTTYPE
    endpoint: ""                                                # PARTICIPANT_CCM_ENDPOINT
    token-source: provider                                      # PARTICIPANT_CCM_TOKENSOURCE

# Read-only window into the compliance tracker's event ledger — the `event_tracker` database its
# views live in (see compliance-tracker/store/tables.go). The hub only ever SELECTs from those
# views (participant_eventlog / participant_event); the tracker remains the schema's sole owner
# and writer. Every eventlog bean and the /api/eventlog endpoints are conditional on the url:
# with it unset — the packaged default, unlike spring.datasource above — the hub runs without
# the tracker database at all. The chart sets it; for a local run against a port-forwarded
# Postgres, set the environment variables.
#eventtracker:
#  datasource:
#    url: jdbc:postgresql://localhost:5432/event_tracker        # EVENTTRACKER_DATASOURCE_URL
#    username: event_tracker                                    # EVENTTRACKER_DATASOURCE_USERNAME
#    password: event_tracker                                    # EVENTTRACKER_DATASOURCE_PASSWORD

# Profile "test": the in-memory MembershipRepository instead of Postgres, with the whole
# DataSource/JPA machinery excluded so no database is required at startup. For tests and
# storage-free local runs.
---
spring:
  config:
    activate:
      on-profile: test
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
      - org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration
