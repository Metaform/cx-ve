openapi: 3.1.0
info:
  title: CX-0009 CX Registration API
  version: 2.1.0
tags:
  - name: Core Service Provider B
    description: Endpoints to be implemented by the Core Service Provider B.
  - name: Onboarding Service Provider
    description: Endpoints to be implemented by the Onboarding Service Provider.
paths:
  /api/administration/registration/network/partnerregistration:
    post:
      tags:
        - Core Service Provider B
      summary: 'Registers a partner company (Authorization required - Roles: configure_partner_registration)'
      requestBody:
        description: Data for the registration
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerRegistrationData'
            example:
              externalId: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
              name: "Example GmbH"
              city: "Munich"
              streetName: "Main street"
              streetNumber: "42"
              streetAdditional: null
              zipCode: "80331"
              region: "BY"
              countryAlpha2Code: "DE"
              bpn: "BPNL000000055EPN"
              shortName: "ExGmbH"
              did: null
              autoSubmit: false
              uniqueIds:
                - type: "COMMERCIAL_REG_NUMBER"
                  value: "HRB 123456"
              userDetails:
                - identityProviderId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                  providerId: "ext-user-001"
                  username: "jane.doe"
                  firstName: "Jane"
                  lastName: "Doe"
                  email: "jane.doe@example.com"
              companyRoles:
                - "ACTIVE_PARTICIPANT"
              agreements:
                - agreementId: "f8e7d6c5-b4a3-2100-fedc-ba9876543210"
                  consentStatus: "ACTIVE"
              fileIds:
                - "b2c3d4e5-f6a7-8901-bcde-f12345678901"
      responses:
        '200':
          description: Empty response on success.
        '500':
          description: Internal Server Error
        '401':
          description: The User is unauthorized
  /api/administration/registration/network/partnerregistration/fileupload:
    post:
      tags:
        - Core Service Provider B
      summary: 'Uploads a file for a partner registration (Authorization required - Roles: configure_partner_registration)'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileUploadRequest'
            example:
              fileName: "handelsregister.pdf"
              contentType: "application/pdf"
      responses:
        '200':
          description: Returns the file ID and a presigned upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUploadResponse'
              example:
                fileId: "b2c3d4e5-f6a7-8901-bcde-f12345678901"
                presignedUploadUrl: "https://storage.example.com/upload/b2c3d4e5?token=..."
                expiresAt: "2026-08-25T12:00:00Z"
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: The User is unauthorized
        '500':
          description: Internal Server Error
  /api/administration/registrationstatus/callback:
    get:
      tags:
        - Core Service Provider B
      summary: 'Gets the callback address of the onboarding service provider (Authorization required - Roles: configure_partner_registration)'
      responses:
        '200':
          description: Returns the company with its address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingServiceProviderCallbackRequestData'
              example:
                callbackUrl: "https://osp.example.com/callbacks/registration"
                authUrl: "https://osp.example.com/oauth/token"
                clientId: "osp-client-id"
                clientSecret: "s3cr3t"
        '400':
          description: Company is no onboarding service provider.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
        '401':
          description: The User is unauthorized
    post:
      tags:
        - Core Service Provider B
      summary: 'Sets the callback address of the onboarding service provider (Authorization required - Roles: configure_partner_registration)'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingServiceProviderCallbackRequestData'
            example:
              callbackUrl: "https://osp.example.com/callbacks/registration"
              authUrl: "https://osp.example.com/oauth/token"
              clientId: "osp-client-id"
              clientSecret: "s3cr3t"
      responses:
        '204':
          description: Returns no content.
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
        '401':
          description: The User is unauthorized
  /{callback}:
    post:
      tags:
        - Onboarding Service Provider
      summary: 'Receives registration status updates from the Core Service Provider B.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OspRegistrationCallbackData'
            example:
              externalId: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
              status: "CONFIRMED"
              message: null
      responses:
        '200':
          description: Callback successfully received.
        '401':
          description: The User is unauthorized.
        '500':
          description: Internal Server Error.
components:
  schemas:
    AgreementConsentData:
      type: object
      properties:
        agreementId:
          type: string
          description: ''
          format: uuid
        consentStatus:
          $ref: '#/components/schemas/ConsentStatusId'
      additionalProperties: false
      description: ''
    CompanyRoleId:
      enum:
        - ACTIVE_PARTICIPANT
        - APP_PROVIDER
        - SERVICE_PROVIDER
        - OPERATOR
        - ONBOARDING_SERVICE_PROVIDER
      type: string
    CompanyUniqueIdData:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/UniqueIdentifierId'
        value:
          type: string
      additionalProperties: false
    ConsentStatusId:
      enum:
        - ACTIVE
        - INACTIVE
      type: string
    DocumentTypeId:
      enum:
        - CX_FRAME_CONTRACT
        - COMMERCIAL_REGISTER_EXTRACT
        - APP_CONTRACT
        - CONFORMITY_APPROVAL_REGISTRATION
        - ADDITIONAL_DETAILS
        - APP_LEADIMAGE
        - APP_IMAGE
        - SELF_DESCRIPTION
        - APP_TECHNICAL_INFORMATION
        - CONFORMITY_APPROVAL_CONNECTOR
        - CONFORMITY_APPROVAL_BUSINESS_APPS
        - CONFORMITY_APPROVAL_SERVICES
        - SERVICE_LEADIMAGE
        - PRESENTATION
        - COMPANY_CERTIFICATE
      type: string
    ErrorDetails:
      type: object
      properties:
        errorCode:
          type: string
        type:
          type: string
        message:
          type: string
        parameters:
          type: array
          items:
            $ref: '#/components/schemas/ErrorParameter'
      additionalProperties: false
    ErrorParameter:
      type: object
      properties:
        name:
          type: string
        value:
          type: string
      additionalProperties: false
    ErrorResponse:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          format: int32
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        errorId:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetails'
          nullable: true
      additionalProperties: false
    FileUploadRequest:
      type: object
      properties:
        fileName:
          type: string
          description: Name of the file the OSP intends to upload.
        contentType:
          type: string
          description: Mimetype of the file the OSP intends to upload.
      required:
        - fileName
        - contentType
      additionalProperties: false
    FileUploadResponse:
      type: object
      properties:
        fileId:
          type: string
          description: Unique ID assigned to this file.
        presignedUploadUrl:
          type: string
          description: URL to which the OSP may upload the file.
        expiresAt:
          type: string
          nullable: true
          description: Date and time until which the presignedUploadUrl is valid.
      required:
        - fileId
        - presignedUploadUrl
      additionalProperties: false
    OnboardingServiceProviderCallbackRequestData:
      type: object
      properties:
        callbackUrl:
          type: string
        authUrl:
          type: string
        clientId:
          type: string
        clientSecret:
          type: string
      additionalProperties: false
    OspRegistrationCallbackData:
      type: object
      properties:
        externalId:
          type: string
          description: Identifier originally provided in the partnerRegistration request.
        status:
          type: string
          enum:
            - SUBMITTED
            - CONFIRMED
            - REJECTED
          description: Current registration status.
        message:
          type: string
          nullable: true
          description: Optional details, e.g. reason for rejection.
      required:
        - externalId
        - status
      additionalProperties: true
    PartnerRegistrationData:
      type: object
      properties:
        name:
          type: string
        city:
          type: string
        streetName:
          type: string
        countryAlpha2Code:
          type: string
        bpn:
          type: string
          nullable: true
        shortName:
          type: string
          nullable: true
        region:
          type: string
        streetAdditional:
          type: string
          nullable: true
        streetNumber:
          type: string
          nullable: true
        zipCode:
          type: string
          nullable: true
        uniqueIds:
          type: array
          items:
            $ref: '#/components/schemas/CompanyUniqueIdData'
        externalId:
          type: string
        userDetails:
          type: array
          items:
            $ref: '#/components/schemas/UserDetailData'
        companyRoles:
          type: array
          items:
            $ref: '#/components/schemas/CompanyRoleId'
        did:
          type: string
          nullable: true
        agreements:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/AgreementConsentData'
        fileIds:
          type: array
          nullable: true
          description: IDs of files associated with this registration request, obtained via the fileupload endpoint.
          items:
            type: string
        autoSubmit:
          type: boolean
          description: >
            Especifies whether a full submission with all data is expected,
            to automatically enact the whole process.
          nullable: true
      additionalProperties: false
    UniqueIdentifierId:
      enum:
        - COMMERCIAL_REG_NUMBER
        - VAT_ID
        - LEI_CODE
        - VIES
        - EORI
      type: string
    UserDetailData:
      type: object
      properties:
        identityProviderId:
          type: string
          format: uuid
          nullable: true
        providerId:
          type: string
        username:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
      additionalProperties: false
  securitySchemes:
    Bearer:
      type: apiKey
      description: >
        JWT Authorization header using the Bearer scheme.
        Enter 'Bearer' [space] and then your token in the text input below.
        Example: "Bearer 12345abcdef"
      name: Authorization
      in: header
security:
  - Bearer: []