# Runtime configuration for the Onboarding API. Values here are the defaults baked into the image.
#
# Every key can be overridden from outside without rebuilding, e.g. from a Kubernetes ConfigMap:
#   - as environment variables (env/envFrom): the exact variable name is noted next to each key
#   - or by mounting a yaml file and pointing SPRING_CONFIG_ADDITIONALLOCATION at it
#     (spring.config.additional-location=/path/to/dir/)

spring:
  application:
    name: cx-ve                                                 # SPRING_APPLICATION_NAME

springdoc:
  swagger-ui:
    path: /swagger                                              # SPRINGDOC_SWAGGERUI_PATH

logging:
  level:
    com.metaform.cxve: INFO                                     # LOGGING_LEVEL_COM_METAFORM_CXVE

# NATS/JetStream issuance-event subscriber (drives onboarding completion).
# Disable when running without a broker (local docker run, tests).
nats:
  enabled: false                                                 # NATS_ENABLED
  url: nats://core-platform-nats.edc-v.svc.cluster.local:4222   # NATS_URL
  stream: edc-events                                            # NATS_STREAM
  durable-name: onboarding-api                                  # NATS_DURABLENAME
  subject-filter: "events.issuance.>"                           # NATS_SUBJECTFILTER
  # Absent -> connect unauthenticated (e.g. local dev NATS)
  # nkey-seed-path: /vault/secrets/nats.nk                      # NATS_NKEYSEEDPATH

# Token exchange (RFC 8693): workload token file + exchange endpoint
token:
  # user.dir = the process working directory (same as $PWD in a shell, but also resolvable in
  # containers, where no shell sets PWD). In Kubernetes point this at the projected token,
  # e.g. /var/run/secrets/jwtlet/token.
  file:
    path: "${user.dir}/token"                                   # TOKEN_FILE_PATH
  exchange:
    url: http://cxve.localhost/api/auth                          # TOKEN_EXCHANGE_URL
    audience: edcv                                              # TOKEN_EXCHANGE_AUDIENCE
    resource: redline                                           # TOKEN_EXCHANGE_RESOURCE

# Downstream services
tenant-manager:
  url: http://cxve.localhost/api/tm                              # TENANT_MANAGER_URL
identityhub:
  url: http://cxve.localhost/api/identity                        # IDENTITYHUB_URL

# Prefix for participant DIDs when the registration doesn't supply one; the participant's short
# name is appended. Must match the platform's IdentityHub did:web hostname (identity.<host>) —
# IdentityHub resolves a DID document by the request URL, so a DID minted under any other
# authority will not resolve through the gateway. A non-default gateway port is percent-encoded
# into the authority, e.g. "did:web:identity.example.com%3A8080:".
participant:
  did:
    template: "did:web:identity.cxve.localhost:"   # PARTICIPANT_DID_TEMPLATE
  # Transfer-type mapping configured on the participant's data plane (Siglet) at provisioning
  # time, via the cfm.dataplane VPA properties. The CFM siglet agent installs the mapping and
  # registers the data-plane instance with the control plane; the mapping key (transfer-type)
  # becomes the catalog distribution format of the participant's assets. An empty endpoint
  # disables data-plane registration entirely (onboarding still succeeds, but no transfers
  # are possible).
  dataplane:
    transfer-type: HttpData-PULL                                # PARTICIPANT_DATAPLANE_TRANSFERTYPE
    endpoint-type: HTTP                                         # PARTICIPANT_DATAPLANE_ENDPOINTTYPE
    endpoint: ""                                                # PARTICIPANT_DATAPLANE_ENDPOINT
    token-source: provider                                      # PARTICIPANT_DATAPLANE_TOKENSOURCE
  # Second transfer-type mapping, pointing at Certo's CCM protocol API (CX-0135 certificate
  # exchange). Certo resolves its outbound tokens + counterparty endpoints from Siglet's flow
  # cache, so a CCM exchange needs a data flow of this transfer type between the two
  # participants; the mapping's endpoint is what the flow's counterparty then calls. Same
  # semantics as `dataplane` above: an empty endpoint leaves the mapping out.
  ccm:
    transfer-type:  "HttpData-PULL"  # PARTICIPANT_CCM_TRANSFERTYPE
    endpoint-type: HTTP                                         # PARTICIPANT_CCM_ENDPOINTTYPE
    endpoint: ""                                                # PARTICIPANT_CCM_ENDPOINT
    token-source: provider                                      # PARTICIPANT_CCM_TOKENSOURCE
