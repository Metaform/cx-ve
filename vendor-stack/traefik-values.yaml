# Traefik for the vendor cluster — the root traefik-values.yaml with the gateway moved to port
# 8080, because the VE's kind cluster already holds port 80 on the host.
#
# The one port number (8080) has to line up in three places, since the vendor advertises
# http://vendor.localhost:8080 as its address and every party dereferences that same URL:
#   * hostPort 8080 — the kind node container's port: reached by the host (via the kind port
#     mapping install.sh creates) and by the VE cluster's pods (at this node's IP on the docker
#     `kind` network);
#   * exposedPort 8080 — the Service port: reached by this cluster's own pods, whose CoreDNS
#     rewrites vendor.localhost to the Traefik Service;
#   * port 80 stays the container port, because the platform's Gateway listener is on 80 and
#     Traefik binds Gateway listeners to the entrypoint with that port.
---
accessLog:
  enabled: true
  format: json
  fields:
    general:
      names:
        RouterName: drop
ports:
  web:
    port: 80
    hostPort: 8080
    exposedPort: 8080
  websecure:
    port: 443
    exposedPort: 8443

podSecurityContext:
  sysctls:
    - name: net.ipv4.ip_unprivileged_port_start
      value: "0"

providers:
  kubernetesGateway:
    enabled: true
  kubernetesCRD:
    enabled: true

gatewayClass:
  enabled: false

gateway:
  enabled: false
