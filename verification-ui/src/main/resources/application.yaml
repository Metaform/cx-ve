# Runtime configuration for the Verification UI. Values here are the defaults baked into
# the image; the local-development defaults point at a VE exposed on cxve.localhost.
#
# Every key can be overridden from outside without rebuilding, e.g. from a Kubernetes ConfigMap:
#   - as environment variables (env/envFrom): the exact variable name is noted next to each key
#   - or by mounting a yaml file and pointing SPRING_CONFIG_ADDITIONALLOCATION at it
#     (spring.config.additional-location=/path/to/dir/)

spring:
  application:
    name: verification-ui                                       # SPRING_APPLICATION_NAME

# Honor X-Forwarded-* (incl. X-Forwarded-Prefix set by the HTTPRoute) so redirects and springdoc
# URLs are generated with the external /ui prefix
server:
  forward-headers-strategy: framework                           # SERVER_FORWARDHEADERSSTRATEGY

springdoc:
  swagger-ui:
    path: /swagger                                              # SPRINGDOC_SWAGGERUI_PATH

logging:
  level:
    com.metaform.cxve.verification: INFO                        # LOGGING_LEVEL_COM_METAFORM_CXVE_VERIFICATION

# The Membership Hub: onboarding of the participant-under-test (and of the permanent
# verification participant), plus the eventlog read API the verdict is judged against.
membership-hub:
  url: http://cxve.localhost/hub                                 # MEMBERSHIPHUB_URL

# The EDC controlplane management API; a token exchanged under verification.management below may
# operate on any participant context (management-api:admin).
management-api:
  url: http://cxve.localhost/api/management/v5                   # MANAGEMENTAPI_URL

# Certo's CCM management API (certo validates the jwtlet bearer itself) — the use-case app of the
# CCM verification, in every dataspace.
certo:
  url: http://cxve.localhost/api/certo/management/v1             # CERTO_URL

# Token exchange (RFC 8693): workload token file + exchange endpoint. For a local run, create
# the token file with:
#   kubectl create token verification-ui -n edc-v \
#     --audience=https://kubernetes.default.svc.cluster.local > token
token:
  # user.dir = the process working directory. In Kubernetes point this at the projected token,
  # e.g. /var/run/secrets/jwtlet/token.
  file:
    path: "${user.dir}/token"                                   # TOKEN_FILE_PATH
  exchange:
    url: http://cxve.localhost/api/auth                          # TOKEN_EXCHANGE_URL
    audience: edcv                                              # TOKEN_EXCHANGE_AUDIENCE

verification:
  # Base of the platform's DSP endpoints; a provider's address is <base>/<pcid>/<dsp-profile> (the
  # dsp-profile of the run's dataspace).
  # Deliberately the EXTERNAL gateway form even in-cluster (the controlplane dereferences it;
  # the CoreDNS rewrites installed by scripts/setup-did-dns.sh make it resolve in pods).
  dsp-base-url: http://cxve.localhost/api/dsp                    # VERIFICATION_DSPBASEURL
  # jwtlet mapping + scope for management-API tokens (scope `admin` expands to
  # management-api:admin and friends; the chart's jwtlet-seed job registers the mapping).
  management:
    token-resource: issuer                                      # VERIFICATION_MANAGEMENT_TOKENRESOURCE
    token-scope: admin                                          # VERIFICATION_MANAGEMENT_TOKENSCOPE
  # jwtlet mapping + scope for certo tokens (certo verifies resource "sudo" itself).
  certo-auth:
    token-resource: sudo                                        # VERIFICATION_CERTOAUTH_TOKENRESOURCE
    token-scope: certo-mgmt-api:write                           # VERIFICATION_CERTOAUTH_TOKENSCOPE
  # Transfer type of the CCM flows: the Data Plane Signaling HTTP transfer profile's pull value
  # (https://eclipse-dataplane-signaling.github.io/profiles/HEAD/#transfer-profiles). It keys the
  # participant's siglet transfer-type mapping (membership-hub participant.ccm.transfer-type), the
  # data-plane registration and the catalog distribution format, so all of them must agree.
  transfer-type: https://w3id.org/dspace-sig/profile/http-pull  # VERIFICATION_TRANSFERTYPE
  # The ledger subject that proves a participant's wallet actually holds its credentials. Every
  # member is offered them over DCP — the hub asks the issuer, the wallet requests them — so a run
  # waits for this delivery before it negotiates anything, whether the participant runs here or
  # elsewhere.
  credential-delivery-subject: events.issuance.credential.delivered  # VERIFICATION_CREDENTIALDELIVERYSUBJECT
  timeouts:
    onboarding: 10m                                             # VERIFICATION_TIMEOUTS_ONBOARDING
    catalog: 2m                                                 # VERIFICATION_TIMEOUTS_CATALOG
    negotiation: 3m                                             # VERIFICATION_TIMEOUTS_NEGOTIATION
    transfer: 3m                                                # VERIFICATION_TIMEOUTS_TRANSFER
    certo: 2m                                                   # VERIFICATION_TIMEOUTS_CERTO
    events: 3m                                                  # VERIFICATION_TIMEOUTS_EVENTS
  poll-interval: 2s                                             # VERIFICATION_POLLINTERVAL
  # A run against a third-party system under test: everything this environment cannot derive
  # because it belongs to the SUT or was agreed with its operator up front.
  external:
    # Scheme used to fetch a did:web document. The did:web method mandates https, but the
    # platform's own runtimes are pinned to edc.iam.did.web.use.https=false — this must follow
    # them, or this app would accept a participant they cannot reach (or reject one they can).
    did-web-scheme: http                                        # VERIFICATION_EXTERNAL_DIDWEBSCHEME
    # Budgets for steps the SUT performs in its own time, not this environment's. Generous by
    # design: a vendor accepting a credential offer or seeding an offer may involve a person.
    credentials-timeout: 15m                                    # VERIFICATION_EXTERNAL_CREDENTIALSTIMEOUT
    provider-offer-timeout: 15m                                 # VERIFICATION_EXTERNAL_PROVIDEROFFERTIMEOUT
    publish-timeout: 15m                                        # VERIFICATION_EXTERNAL_PUBLISHTIMEOUT

  # The dataspaces a run can verify against, in the order the UI offers them, keyed by the
  # dataspace id the Membership Hub knows them by. A dataspace is offered as available only while
  # the hub serves it (GET /hub/api/dataspaces); a use case only when it is enabled here AND this
  # environment implements its verification (so far: ccm).
  dataspaces:
    catena-x:
      display-name: Catena-X
      # What a member id is called and looks like here — the run form's label, placeholder and
      # validation. Catena-X: the BPNL, the legal-entity BPN (CX-0010).
      member-id:
        label: BPN
        pattern: "BPNL[0-9A-Z]{12}"
        example: BPNL000000000001
      # The DSP dataspace profile of every catalog, negotiation and transfer request — and the last
      # segment of a provider's DSP address. Must be what the connector advertises.
      dsp-profile: cx-neptune
      # The policies of every offer this environment seeds. The leftOperands are Catena-X policy
      # terms (in policy-context), each backed by a CEL expression the catenax-profile chart seeds;
      # the rightOperands are placeholders — the CEL expressions check fixed credential claims.
      policy-context: https://w3id.org/catenax/2025/9/policy/context.jsonld
      access-constraints:
        - { left-operand: Membership, operator: eq, right-operand: active }
      contract-constraints:
        - { left-operand: FrameworkAgreement, operator: eq, right-operand: "DataExchangeGovernance:1.0" }
        - { left-operand: UsagePurpose, operator: isAnyOf, right-operand: "cx.pcf.base:1" }
        - { left-operand: DataUsageEndDefinition, operator: eq, right-operand: "cx.dataUsageEnd.unlimited:1" }
      # The Catena-X `registration` object of a hub member request (the CX-0009 registration
      # beyond the common fields). The ACTIVE "Catena-X" agreement matters: it becomes the
      # member's memberOf, which the Membership policy checks.
      registration-template: |
        {
          "city": "Munich",
          "streetName": "Otto-Hahn-Ring",
          "countryAlpha2Code": "DE",
          "region": "BY",
          "uniqueIds": [ { "type": "VAT_ID", "value": "{{uniqueId}}" } ],
          "companyRoles": [ "ACTIVE_PARTICIPANT" ],
          "agreements": [ { "agreementId": "Catena-X", "consentStatus": "ACTIVE" } ],
          "userDetails": [ {
            "providerId": "vui-user-{{uniqueId}}",
            "firstName": "Verification", "lastName": "Runner",
            "email": "vui-{{uniqueId}}@example.com"
          } ]
        }
      # The dataspace's permanent verification participant. Its member id is the rediscovery key
      # after restarts (hub lookup), so keep it stable; it is pinned rather than hash-derived to be
      # readable in logs and the UI. The short name forms its hosted DID and must be unique across
      # dataspaces (the hub deploys a DID only once).
      verification-participant:
        name: "Verification Participant"
        short-name: verification-participant
        member-id: BPNLVERIFY000001
        unique-id: DEVERIFY0001
      use-cases:
        ccm:
          display-name: Company Certificate Management
          enabled: true
          ccm:
            # The verification participant's permanent CCM inbox asset (the push-flow target). The
            # control plane's ids are unique across ALL participant contexts, so every dataspace's
            # participant needs its own (checked at startup).
            inbox-asset-id: ccm-inbox-verification
            # CX-0135: how a CCM API offer is identified in a catalog — dct:type cx-taxo:CCMAPI, a
            # dct:subject naming the provider or consumer API, and cx-common:version. This
            # environment's own inbox declares the consumer API, a system under test's offer is
            # looked up as the provider API. Asset ids play no part — a business partner may offer
            # only one asset per API and version.
            api:
              taxonomy: "https://w3id.org/catenax/taxonomy#"
              taxonomy-prefix: cx-taxo
              version-property: "https://w3id.org/catenax/ontology/common#version"
              version-prefix: cx-common
              version: "3.0"
            # The sample certificate a managed run publishes: its issuer and certified site (BPNs).
            certificate:
              issuer-name: Verification Environment CA
              issuer-id: BPNL00000000ISSUER
              site-id: BPNA00000000MAIN0
            # The verdict's expected-events checklist: eventlog subject -> minimum count on the
            # participant-under-test's log. The >=2 counts assume the provider-side controlplane
            # events of both CCM flows carry the participant-under-test's context id — tune here
            # (chart-overridable, no rebuild) if a live run shows different attribution.
            expected-events:
              "[events.onboarding.started]": 1
              "[events.onboarding.completed]": 1
              "[events.participantcontext.created]": 1
              "[events.diddocument.published]": 1
              "[events.keypair.added]": 1
              "[events.issuance.credential.delivered]": 1
              "[events.contract.negotiation.finalized]": 2
              "[events.transfer.process.started]": 2
              "[events.certificate.exchange.fulfilled]": 1
              "[events.certificate.exchange.accepted]": 1
            # The ledger checklist for an external participant. Deliberately short: the identity
            # events above belong to wallets THIS environment provisions, and the exchange's own
            # events carry the verification participant's context rather than the SUT's. What
            # remains is what the tracker can honestly attribute to a participant hosted elsewhere —
            # and the credential delivery is the load-bearing one: it proves the SUT accepted this
            # environment's offer over DCP.
            external-expected-events:
              "[events.onboarding.started]": 1
              "[events.onboarding.completed]": 1
              "[events.issuance.credential.delivered]": 1
        # Listed so operators see it exists; not verifiable yet (no implementation).
        traceability:
          display-name: Traceability
          enabled: false
    # Decade-X, onboarded through the dx-onboarding-api, the TSP onboarding intake (the hub's
    # dataspaces.decade-x): an approval has the platform's issuer offer the participant the
    # DecadeXMembershipCredential, which its wallet then requests. Still partly a PLACEHOLDER: the
    # policy vocabulary is unsettled (the offers this environment seeds carry no constraints, so
    # nothing asks for the credential yet), and the CCM vocabulary assumes Certo's Catena-X API
    # identity carries over.
    decade-x:
      display-name: Decade-X
      member-id:
        label: Decade-X-ID
        pattern: "DX-[0-9]{8}"
        example: DX-00000001
        # The Decade-X TSP assigns an external participant's Decade-X-ID on approval: an external
        # run takes none up front and adopts it. A participant hosted here brings its own.
        assigned-to-external: true
      # Catena-X's, for now — the platform advertises one DSP profile for every participant
      # (see the hub's dataspaces.decade-x.dataspace-profiles).
      dsp-profile: cx-neptune
      policy-context: https://w3id.org/decadex/policy/context.jsonld
      # The TSP's onboarding request, minus what the hub fills in itself (legal name, DID,
      # applicantReference); the hub also adds the placeholder GTC and UCA documents.
      registration-template: |
        {
          "legalEntity": {
            "registrationCountry": "DE",
            "companyType": "LIMITED_LIABILITY_COMPANY",
            "registrationNumbers": [ { "scheme": "vatID", "value": "{{uniqueId}}" } ],
            "legalAddress": { "street": "Otto-Hahn-Ring 6", "postalCode": "81739", "locality": "Munich",
                              "countryCode": "DE", "countryName": "Germany" }
          },
          "legalPerson": { "fullName": "Verification Operator", "email": "vui-{{uniqueId}}@example.com",
                           "role": "Operator" },
          "gtc": { "versionId": "0b8e1f0e-5c0a-4a52-9a53-7a1d2c3b4e5f", "versionNumber": "1.0", "accepted": true },
          "ucas": [ { "useCaseId": "ccm", "useCaseName": "Company Certificate Management", "versionNumber": "1.0",
                      "accepted": true } ],
          "declarations": { "informationAccurate": true, "authorisedToAct": true, "evidenceMayBeRequested": true }
        }
      verification-participant:
        name: "Verification Participant (Decade-X)"
        short-name: verification-participant-dx
        member-id: DX-99999999
        unique-id: DXVERIFY0001
      use-cases:
        ccm:
          display-name: Company Certificate Management
          enabled: true
          ccm:
            inbox-asset-id: ccm-inbox-verification-dx
            api:
              taxonomy: "https://w3id.org/catenax/taxonomy#"
              taxonomy-prefix: cx-taxo
              version-property: "https://w3id.org/catenax/ontology/common#version"
              version-prefix: cx-common
              version: "3.0"
            certificate:
              issuer-name: Verification Environment CA
              issuer-id: DX-00000000
              site-id: DX-00000000-MAIN
            # No credential delivery here, unlike Catena-X, though the participant IS offered the
            # DecadeXMembershipCredential: the compliance tracker follows a participant from its
            # events.onboarding.started, which only the cx-onboarding-api publishes — so no Decade-X
            # participant has a ledger the delivery could be attributed to. Same reason the external
            # checklist stays unset.
            expected-events:
              "[events.participantcontext.created]": 1
              "[events.diddocument.published]": 1
              "[events.keypair.added]": 1
              "[events.contract.negotiation.finalized]": 2
              "[events.transfer.process.started]": 2
              "[events.certificate.exchange.fulfilled]": 1
              "[events.certificate.exchange.accepted]": 1
        substance-tracing:
          display-name: Substance tracing
          enabled: false
