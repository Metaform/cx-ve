# Installs the full stack in dependency order: `helmfile apply` (or `helmfile -l name=certo apply`
# for a single release). Each release keeps its own values file under ./values/ — point the paths at
# your existing files, no merging needed. `needs:` encodes the install sequence; adjust if the order
# differs. OCI charts require an explicit version — pin the ones you actually deploy.

releases:
  - name: core-platform
    namespace: edc-v
    chart: oci://ghcr.io/eclipse-cfm/charts/core-platform-distribution
    version: 0.0.17
    values:
      - values/platform.yaml
      - postgres:
          persistence:
            enabled: true

  - name: cx-profile
    namespace: edc-v
    chart: oci://ghcr.io/metaform/charts/catenax-profile
    version: 0.0.5            # pin me
    needs:
      - edc-v/core-platform
    values:
      - issuer:
          did: "did:web:issuer.vps.beardyinc.com:issuer"
      - global:
          namespace: "edc-v"

  - name: obapi
    namespace: edc-v
    chart: oci://ghcr.io/metaform/charts/cx-ve
    needs:
      - edc-v/cx-profile
    values:
      - values/obapi.yaml

  - name: certo
    namespace: edc-v
    chart: oci://ghcr.io/metaform/charts/certo
    needs:
      - edc-v/obapi
    values:
      - values/certo.yaml
