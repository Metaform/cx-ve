apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dx-onboarding-api.fullname" . }}
  labels:
    {{- include "dx-onboarding-api.labels" . | nindent 4 }}
spec:
  # Onboarding requests and their documents are held in memory — one replica, by design.
  replicas: 1
  selector:
    matchLabels:
      {{- include "dx-onboarding-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dx-onboarding-api.selectorLabels" . | nindent 8 }}
      annotations:
        # Roll the pods whenever the rendered config changes
        checksum/config: {{ include (print $.Template.BasePath "/dx-onboarding-api-config.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SPRING_CONFIG_ADDITIONALLOCATION
              value: /etc/dx-onboarding-api/application.yaml
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
          volumeMounts:
            - name: config
              mountPath: /etc/dx-onboarding-api
              readOnly: true
            # the workload token exchanged at the jwtlet for the IssuerService calls (token.file.path)
            - name: jwtlet-subject-token
              mountPath: /var/run/secrets/jwtlet
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "dx-onboarding-api.fullname" . }}-config
        # RFC 8693 subject_token, exchanged at the jwtlet; the audience must match jwtlet's
        # `client_audience`.
        - name: jwtlet-subject-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: {{ .Values.jwtlet.subjectTokenAudience | quote }}
                  expirationSeconds: {{ .Values.jwtlet.subjectTokenExpirationSeconds }}
