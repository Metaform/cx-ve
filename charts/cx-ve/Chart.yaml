apiVersion: v2
name: cx-ve
description: >-
  Umbrella chart for the Verification Environment: Core Platform Distribution, DECADE-X
  profile seeding and onboarding API, Membership Hub, Verification UI, Certo and the Certo CFM
  agent, installed as a single release.
type: application
version: 0.1.0
appVersion: "latest"

# NOTE the release name is load-bearing: the platform chart derives its infra resource names
# from it (<release>-nats, <release>-vault, <release>-postgresql, <release>-nats-auth) and the
# values here reference those names. Install this chart as release "cx-ve".
dependencies:
  # Connector, IdentityHub, IssuerService, Siglet, CFM, jwtlet/clearglass, gateway routes,
  # infra (NATS/Vault/Postgres/telemetry) + generic platform seeding
  - name: core-platform-distribution
    repository: oci://ghcr.io/eclipse-cfm/charts
    version: 0.0.34
  # The DECADE-X onboarding API (the TSP onboarding intake) from this repository
  - name: dx-onboarding-api
    repository: file://../dx-onboarding-api
    version: ">=0.0.0-0"
  # DECADE-X dataspace seeding (the issuer's credential definitions, the EDC dataspace profile and
  # its DCP scope, and the Tenant Manager dataspace profile participant provisioning needs) from
  # this repository
  - name: decadex-profile
    repository: file://../decadex-profile
    version: ">=0.0.0-0"
  # The Membership Hub application chart from this repository
  - name: membership-hub
    repository: file://../membership-hub
    version: ">=0.0.0-0"
  # The Verification UI (dashboard + verification-run BFF) application chart from this repository
  - name: verification-ui
    repository: file://../verification-ui
    version: ">=0.0.0-0"
  # Certo (DSAF SCE certificate exchange service)
  - name: certo
    repository: oci://ghcr.io/metaform/charts
    version: 0.0.8
    condition: certo.enabled
