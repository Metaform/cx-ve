apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cx-ve.fullname" . }}
  labels:
    {{- include "cx-ve.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "cx-ve.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cx-ve.selectorLabels" . | nindent 8 }}
      annotations:
        # Roll the pods whenever the rendered config changes
        checksum/config: {{ include (print $.Template.BasePath "/onboardingapi-config.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- if and .Values.natsAuth.enabled .Values.config.nats.enabled }}
      initContainers:
        # Logs into Vault with the pod's SA token, reads the app's NKey seed and drops it on the
        # pod-private in-memory volume. Retries until the platform's vault/nats-auth bootstrap
        # has created the role and stored the seed.
        - name: fetch-nats-nkey
          image: {{ .Values.natsAuth.image }}
          command: [ "sh", "-ec" ]
          args:
            - |
              export VAULT_ADDR={{ .Values.natsAuth.vaultUrl | quote }}
              echo "Fetching the NATS NKey seed (Vault role {{ .Values.natsAuth.vaultRole }})..."
              until VAULT_TOKEN=$(vault write -field=token auth/kubernetes/login \
                  role={{ .Values.natsAuth.vaultRole }} \
                  jwt=@/var/run/secrets/kubernetes.io/serviceaccount/token 2>/dev/null); do
                echo "Vault login failed (Vault or its bootstrap not ready yet), retrying in 2 seconds..."
                sleep 2
              done
              export VAULT_TOKEN
              until vault kv get -field=seed {{ .Values.natsAuth.vaultSecretPath }} > /vault/secrets/nats.nk 2>/dev/null; do
                echo "Seed not in Vault yet (nats-auth-bootstrap still running?), retrying in 2 seconds..."
                sleep 2
              done
              # 0444 rather than 0400: init and app container may run as different UIDs;
              # the volume is pod-private tmpfs either way.
              chmod 0444 /vault/secrets/nats.nk
              echo "NKey seed written to /vault/secrets/nats.nk"
          volumeMounts:
            - name: nats-nkey
              mountPath: /vault/secrets
      {{- end }}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SPRING_CONFIG_ADDITIONALLOCATION
              value: /etc/cx-ve/application.yaml
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
          volumeMounts:
            - name: config
              mountPath: /etc/cx-ve
              readOnly: true
            # RFC 8693 subject token exchanged at jwtlet for participant-scoped tokens
            # (config token.file.path points here)
            - name: jwtlet-subject-token
              mountPath: /var/run/secrets/jwtlet
              readOnly: true
            {{- if and .Values.natsAuth.enabled .Values.config.nats.enabled }}
            - name: nats-nkey
              mountPath: /vault/secrets
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "cx-ve.fullname" . }}-config
        # Audience must match jwtlet's `client_audience` (the Kubernetes cluster issuer)
        - name: jwtlet-subject-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: {{ .Values.jwtlet.subjectTokenAudience | quote }}
                  expirationSeconds: {{ .Values.jwtlet.subjectTokenExpirationSeconds }}
        {{- if and .Values.natsAuth.enabled .Values.config.nats.enabled }}
        # Pod-private in-memory volume the NKey seed is delivered on (never hits disk)
        - name: nats-nkey
          emptyDir:
            medium: Memory
        {{- end }}
