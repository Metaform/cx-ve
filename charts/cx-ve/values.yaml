# The complete, checked-in configuration of the local Verification Environment. Defaults target
# the kind cluster stood up by scripts/install-ve.sh (host cxve.localhost, namespace edc-v).
# A different host means overriding every host-derived key below (see install-ve.sh --host).
#
# Subchart values nest under the dependency's chart name; the `global` block propagates to all
# subcharts automatically.

global:
  host: cxve.localhost
  # Fixed: the CFM agents hardcode system:serviceaccount:edc-v:… client ids when registering
  # jwtlet mappings during participant provisioning; any other namespace breaks provisioning.
  namespace: edc-v
  # The platform's Gateway resource; restated from the platform default so the umbrella's own
  # HTTPRoutes (osp-idp) can attach to it.
  gatewayName: edcv-gateway

# ==== NATS authentication (NKey) ===============================================================
# ON everywhere. Components authenticate to NATS with per-component NKeys: the platform's
# nats-auth-bootstrap job generates the seeds into Vault and renders users.conf into the
# <release>-nats-auth Secret, vault-bootstrap creates a `nats-<component>` policy + k8s-auth role
# per service account, and each pod gets a fetch-nats-nkey init container that pulls its own seed.
#
# TURNING IT OFF IS ALL-OR-NOTHING — there are SIX switches across four charts and no single
# global flag (a parent chart cannot drive a subchart value from a template, so they cannot be
# collapsed). Flip ALL of them together, or leave them all alone:
#
#   1. core-platform-distribution.nats.auth.enabled  -> false   (below)
#   2. certoAgent.natsAuth.enabled                   -> false   (see certoAgent, further down)
#   3. complianceTracker.natsAuth.enabled            -> false   (see complianceTracker, at the end)
#   4. certo.natsAuth.enabled                        -> false   (see certo, below)
#   5. dx-onboarding-api.natsAuth.enabled            -> false   (see dx-onboarding-api, below)
#   6. dx-onboarding-api.config.nats.nkey-seed-path  -> ""      (see dx-onboarding-api, below)
#
# Flipping only #1 is the dangerous half-measure: it removes the PROVISIONING (no
# nats-auth-bootstrap job -> no <release>-nats-auth Secret; vault-bootstrap skips the nats-*
# policies and roles) while #2-#5 still CONSUME it. Their init containers and seed jobs retry
# forever by design, so the pods sit in Init:0/1 indefinitely instead of failing — certo-agent and
# compliance-tracker loop on `invalid role name "nats-cfm-agents"` (hidden by a 2>/dev/null in the
# templates).
#
# #6 is easy to miss: it is NOT gated by #5. It is a plain value rendered through
# `toYaml .Values.config` into the app's application.yaml, so leaving it set makes the app attempt
# NKey auth against a seed file no init container writes any more. "" is the documented
# connect-unauthenticated value (NatsProperties.hasNkeyAuth() is false for blank).
#
# With auth off the platform renders nats.conf without an `authorization` block at all, so NATS
# accepts unauthenticated connections and nothing else needs changing.
#
# #4 additionally has to be off REGARDLESS of the others, until the platform provisions a certo NATS
# identity: nats-auth-bootstrap mints users from a fixed list (controlplane, identityhub,
# issuerservice, cfm-agents, nats-admin) with no certo entry, so even with #1 left ON there is no
# `nats-certo` role or seed for certo's init container to fetch. Note that switching #4 off does not
# stop certo publishing — certo.events.nats stays on and connects unauthenticated, which is exactly
# what scripts/install-ve.sh sets up.
# ===============================================================================================

# ---- Core Platform Distribution --------------------------------------------------------------
core-platform-distribution:
  # Name the platform's app Deployments and bootstrap/seed Jobs <release>-<component>
  # (cx-ve-jwtlet, cx-ve-issuerservice, ...), matching everything else this umbrella deploys.
  # Deployments and Jobs only — Service DNS (jwtlet.edc-v.svc...) and the
  # system:serviceaccount:edc-v:* identities are unaffected, so nothing here or in the app
  # charts needs to follow suit. Requires core-platform-distribution >= 0.0.25.
  prefixWorkloadNames: true
  # NATS auth switch 1 of 6 — see the NATS authentication block above. Uncomment together with
  # switches 2-6. Covers EVERY platform component at once: the init containers, volumes and
  # nats.auth.method / edc.nats.auth.nkey.seed.path config keys for controlplane, identityhub,
  # issuerservice, tenant-manager, provision-manager, cfm-agents, cfm-lifecycle-agents and
  # kmagent, plus the authorization include in nats.conf, the nats-auth-bootstrap job, the nats-*
  # policies/roles in vault-bootstrap and the --nkey flag on nats-bootstrap.
  # nats:
  #   auth:
  #     enabled: false
  nats:
    auth:
      # Adds this release's own workloads to the platform's shared `edc-events` NATS identity, so
      # certo and the onboarding API authenticate as it instead of each minting a user the platform
      # would drop on its next upgrade.
      #
      # The three platform SAs MUST be restated: Helm replaces lists rather than merging them, so
      # omitting one here would revoke the control plane's, identity hub's or issuer service's
      # access to their own seed.
      users:
        edc-events:
          serviceAccounts:
            - controlplane
            - identityhub
            - issuerservice
            - certo
            - dx-onboarding-api
  edc:
    controlplane:
      # ADDITIONAL issuers for the ROOT (config-based) trusted-issuer registry, rendered as
      # edc.iam.trusted-issuer.<name>.id. The VE's own issuer is ALWAYS rendered by the platform
      # chart itself under the reserved alias `issuer` (edc.iam.trusted-issuer.issuer.id,
      # derived from global.host) — do NOT repeat it here, and never reuse the `issuer` alias
      # (it would render a duplicate config key). Keep this list in sync with
      # decadex-profile.issuer.trustedIssuers below, e.g.:
      #   trustedIssuers:
      #     - name: vendor
      #       id: "did:web:issuer.vendor.example.com:issuer"
      trustedIssuers: []
      dataspaceProfiles:
        # The profile name each participant's DID document advertises its DSP endpoint under
        # (the `ProtocolEndpoint` service entry). The controlplane serves one protocol context
        # per REGISTERED profile at /api/dsp/<participantContextId>/<profile name>, and the only
        # profile this VE registers is the DECADE-X one the decadex-profile chart seeds —
        # `decade-x`. Left at the platform default (`http-dsp-profile-2025-1`, the built-in
        # profile this VE does not register) every participant would publish an endpoint that
        # 404s. Harmless between participants of THIS environment, which address each other by
        # the profile they both know they use, and fatal for an external counterparty, whose
        # only way to find the endpoint is the DID document.
        advertisedProfile: decade-x
    siglet:
      refreshEndpointPolicy:
        allowHttp: true
      # The Data Plane Signaling HTTP transfer profile, pull direction
      # (https://eclipse-dataplane-signaling.github.io/profiles/HEAD/#transfer-profiles): the
      # transfer type is the profile value, and the endpointType of the DataAddress Siglet hands
      # out MUST be that same value.
      transferTypes:
        - transferType: "https://w3id.org/dspace-sig/profile/http-pull"
          endpointType: "https://w3id.org/dspace-sig/profile/http-pull"
          endpoint: "http://provider:8080/data"
          tokenSource: "provider"
          txRenewalSupport: true
  cfm:
    agents:
      jwtlet:
        clientMappings:
          - name: controlplane
            scopes: [read, signaling]
          - name: identityhub
            scopes: [read]
          - name: siglet-sa
            scopes: [read]
          - name: certo
            scopes: [siglet-token]
  postgresql:
    # Helm replaces lists wholesale, so this list must repeat the platform defaults in full —
    # the `certo`, `event_tracker` and `hydra` entries are the CX-VE-specific additions (certo's
    # database, the compliance tracker's event ledger and the OSP IdP's store live in the
    # platform's Postgres).
    databases:
      - { db: controlplane,  user: cp,      password: cp }
      - { db: identityhub,   user: ih,      password: ih }
      - { db: issuerservice, user: issuer,  password: issuer }
      - { db: dataplane,     user: dp,      password: dp }
      - { db: cfm,           user: cfm,     password: cfm }
      - { db: sigletdb,      user: siglet,  password: siglet }
      - { db: jwtlet,        user: jwtlet,  password: jwtlet }
      - { db: certo,         user: certo,   password: certo }
      - { db: event_tracker, user: event_tracker, password: event_tracker }
      - { db: hydra,         user: hydra,   password: hydra }

# ---- DECADE-X onboarding API -------------------------------------------------------------------
# The TSP onboarding intake. There is no TSP operator yet: requests are approved automatically —
# those of participants hosted here, and for now those of external ones too
# (dx-onboarding-api.config.dx-onboarding.review). On approval it registers the participant as a
# credential holder and has the platform's issuer offer it the DX_LegalEntity_VC and DX_Site_VC (see
# decadex-profile below).
dx-onboarding-api:
  image:
    pullPolicy: IfNotPresent

# ---- DECADE-X profile ---------------------------------------------------------------------------
# DECADE-X's dataspace seeding (charts/decadex-profile): the DX_LegalEntity_VC's and DX_Site_VC's
# definitions on the platform's issuer, and the EDC dataspace profile DECADE-X participants run DSP
# under (`decade-x`, trusting the platform's issuer, with a DCP scope asking for the Legal Entity
# VC). Its credential definition ids must match the dx-onboarding-api's
# issuer-service.credential-definitions, and its dspProfile the connector's advertised profile above
# and the hub's and the verification UI's DECADE-X DSP profile.
decadex-profile:
  dspProfile: decade-x
  issuer:
    # host-derived: the install scripts override it
    did: "did:web:issuer.cxve.localhost:issuer"
    # ADDITIONAL issuer DIDs trusted in the decade-x dataspace profile. Keep in sync with
    # core-platform-distribution.edc.controlplane.trustedIssuers above.
    trustedIssuers: []

# ---- Membership Hub ---------------------------------------------------------------------------
# Drives the full member journey in each dataspace it serves: EDC resource provisioning via the
# CFM Tenant Manager for a member this VE hosts, then registration via the dataspace's onboarding
# API (as OSP client membership-hub, seeded under ospIdp.clients below). All URLs in the subchart's
# defaults already point at the umbrella's in-cluster services.
membership-hub:
  image:
    pullPolicy: IfNotPresent

# ---- Verification UI -------------------------------------------------------------------------
# Angular dashboard + BFF driving the full verification journey (onboard a participant under
# test, establish the CCM flows, run the certificate exchange, judge the run against
# the compliance tracker's eventlog through the hub's read API). All URLs in the subchart's
# defaults already point at the umbrella's in-cluster services.
verification-ui:
  image:
    pullPolicy: IfNotPresent


# ---- Certo (DSAF SCE certificate exchange) ---------------------------------------------------
certo:
  enabled: true
  gateway:
    name: edcv-gateway
    namespace: edc-v
    hostnames:
      - cxve.localhost
    pathPrefix: /api/certo
  # Certo's siglet backend: token verification (POST /tokens/verify) and the outbound
  # token/endpoint cache (GET /tokens/{pcid}/{flowId}). MUST be the in-cluster siglet API —
  # certo sends these calls without a bearer token, and the gateway route (/api/siglet) sits
  # behind clearglass, which requires siglet-api scopes on /tokens/** (and doesn't map
  # POST /tokens/verify at all -> default deny).
  sigletBaseUrl: "http://siglet.edc-v.svc.cluster.local:8080"

  tokenExchange:
    enabled: true
    url: http://jwtlet.edc-v.svc.cluster.local:8080/token
    audience: edcv
    scope: siglet-token
    subjectTokenAudience: https://kubernetes.default.svc.cluster.local
  # Certificate-exchange status changes published as CloudEvents onto the platform's
  # edc-events stream, on subjects events.certificate.exchange.* — the same stream and envelope shape
  # the EDC runtimes use, so the compliance tracker and any other events.> consumer sees them
  # alongside the connector's.
  #
  # ON by default. natsAuth below is NATS auth switch 4 of 6 (see the block at the top of this file);
  # publishing itself stays on when auth is switched off, over an unauthenticated connection.
  #
  # CAVEAT: the platform's nats-auth-bootstrap mints users from a fixed list (controlplane,
  # identityhub, issuerservice, cfm-agents, nats-admin) with NO certo entry, so until certo has an
  # identity there, natsAuth.enabled=true against an auth-ON platform leaves the pod in Init:0/1
  # with nothing to fetch. scripts/install-ve.sh disables it (along with the other switches)
  # for exactly this reason.
  #
  # NOTE these keys need a certo chart NEWER than the pinned 0.0.2, which has no NATS templates at
  # all. Helm ignores unknown subchart values silently, so until the dependency in Chart.yaml is
  # bumped this block renders nothing — no error, no env vars, no events.
  events:
    nats:
      enabled: true
      url: nats://cx-ve-nats.edc-v.svc.cluster.local:4222
      # Created by the platform's nats-bootstrap job with subjects "events.>"; certo binds to no
      # stream itself, it publishes to a subject the server routes here.
      stream: edc-events
      # Never in-cluster: the stream is the platform's, and certo's user may not manage streams.
      createStream: false
  natsAuth:
    # NATS auth switch 4 of 6 — see the NATS authentication block at the top of this file. Set to
    # false only together with switches 1-3, 5 and 6.
    enabled: true
    vaultUrl: http://cx-ve-vault.edc-v.svc.cluster.local:8200
    # Certo REUSES the platform's shared `edc-events` identity — it publishes on events.>, which is
    # that identity's profile — rather than needing a user of its own. What makes this work is the
    # `certo` ServiceAccount being listed under
    # core-platform-distribution.nats.auth.users.edc-events.serviceAccounts below.
    vaultRole: nats-edc-events
    vaultSecretPath: secret/nats/edc-events
    image: hashicorp/vault:latest
  # Management-API tokens are validated against the platform's jwtlet; the explicit JWKS URI
  # activates certo's EdDSA-capable decoder.
  extraEnv:
    - name: CERTO_MGMT_ISSUER_URI
      value: http://jwtlet.edc-v.svc.cluster.local:8080
    - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI
      value: http://jwtlet.edc-v.svc.cluster.local:8080/.well-known/jwks.json
  database:
    url: jdbc:postgresql://cx-ve-postgresql.edc-v.svc.cluster.local:5432/certo
    username: certo
    password: certo
    ddlAuto: update
  # Certo's workload identity: the umbrella's certo-jwtlet-seed maps
  # system:serviceaccount:edc-v:certo to the "sudo" participant context with the
  # certo-mgmt-api scopes — the SA name here and that mapping must agree.
  # NOTE requires a certo chart > 0.0.1: the published 0.0.1 predates the ServiceAccount
  # template and runs the pod under the namespace default SA.
  serviceAccount:
    create: true
    name: certo

# ---- OSP IdP (Ory Hydra) ---------------------------------------------------------------------
# OAuth2 issuer for EXTERNAL callers of the Onboarding API (the onboarding service provider
# role): client_credentials tokens, validated by the API against this IdP's JWKS. See
# templates/osp-idp.yaml — the issuer/token URL is http://<global.host>/auth/osp, so it follows
# the host automatically; the dx-onboarding-api subchart's issuer-uri must be overridden alongside
# a non-default host (install-ve.sh does).
ospIdp:
  enabled: true
  image: oryd/hydra:v2.2.0
  seedImage: curlimages/curl:latest
  # Hydra's system secret (key encryption at rest); >= 16 chars. Dev-grade default, fine for the
  # throwaway VE.
  systemSecret: cxve-dev-system-secret
  database:
    # The `hydra` database comes from the postgresql.databases list above (its CX-VE entry)
    dsn: postgres://hydra:hydra@cx-ve-postgresql.edc-v.svc.cluster.local:5432/hydra?sslmode=disable
  # OSP clients seeded into the IdP (osp-idp-seed-job.yaml; upserted on upgrade). `scope` is the
  # space-separated maximum a client may request; the DECADE-X onboarding API requires an
  # authenticated caller, no particular scope.
  clients:
    # For callers outside the hub, e.g. an operator or a test submitting onboarding requests directly.
    - id: osp-client
      secret: osp-secret
      scope: ""
    # The Membership Hub's own OSP identity. Must agree with the membership-hub chart's config
    # dataspaces.decade-x.onboarding.auth.*
    - id: membership-hub
      secret: membership-hub-secret
      scope: ""
  resources: {}

# ---- jwtlet endpoints for the umbrella's own seed jobs and the certo agent -------------------
jwtlet:
  healthUrl: http://jwtlet.edc-v.svc.cluster.local:8080/health
  mgmtUrl: http://jwtlet.edc-v.svc.cluster.local:8081/api/v1
  # Audience of the projected SA token; must match jwtlet's `client_audience`
  # (the Kubernetes cluster issuer)
  subjectTokenAudience: https://kubernetes.default.svc.cluster.local
  subjectTokenExpirationSeconds: 3600
  seed:
    enabled: true
    # jwtlet participant-token audience (client_audience / bound_audiences)
    audiences:
      - edcv
    image: curlimages/curl:latest
    hookDeletePolicy: before-hook-creation,hook-succeeded
    ttlSecondsAfterFinished: 600

# ---- Certo CFM agent -------------------------------------------------------------------------
# CFM orchestration agent for Certo: subscribes to the platform's CFM activity stream on NATS
# and creates a participant context in Certo for every provisioned participant. Deployed by
# this umbrella rather than the platform because Certo is CX-VE-specific.
certoAgent:
  enabled: true
  replicas: 1
  image:
    repository: ghcr.io/eclipse-cfm/cfm/certoagent
    tag: 0.0.3
    pullPolicy: IfNotPresent
  # The agent runs under the platform's "cfm-agents" ServiceAccount; the certo-jwtlet-seed job
  # maps that SA to the "sudo" participant context with the certo-mgmt-api scopes, authorizing
  # the agent's calls to certo's management API.
  resources: {}
  # NKey auth for the agent's NATS connection. The platform's own bootstrap provisions the
  # cfm-agents component: vault-bootstrap creates the "nats-cfm-agents" k8s-auth role (bound to
  # the cfm-agents SA) and nats-auth-bootstrap generates + stores the seed at
  # secret/nats/cfm-agents and registers its public key in users.conf — nothing to seed from
  # this release, the init container only fetches the ready-made seed.
  natsAuth:
    # NATS auth switch 2 of 6 — see the NATS authentication block at the top of this file. Set to
    # false only together with switches 1 and 3-6. Because this consumes what switch 1 provisions,
    # leaving it true while 1 is false parks the pod in Init:0/1 forever: the init container loops
    # on `invalid role name "nats-cfm-agents"`, and the template's 2>/dev/null hides that error
    # behind a generic "Vault or its bootstrap not ready yet" message.
    enabled: true
    vaultUrl: http://cx-ve-vault.edc-v.svc.cluster.local:8200
    vaultRole: nats-cfm-agents
    vaultSecretPath: secret/nats/cfm-agents
    image: hashicorp/vault:latest
  # Post-install/upgrade hook job that registers the certo-activity ActivityDefinition in the
  # platform's provision manager and re-creates the VPA orchestration definition with the certo
  # steps added. CAVEAT: the provision manager upserts orchestration definitions by type, so
  # this REPLACES the platform-seeded definition and its DAG must mirror the platform's
  # provision-manager-seed-job; a platform upgrade re-runs that job and overwrites the
  # definition again — re-run `helm upgrade` on this release to re-apply it (the job re-runs on
  # every revision).
  seed:
    enabled: true
    # The provision manager's management API
    pmUrl: http://provision-manager.edc-v.svc.cluster.local:8080
    image: curlimages/curl:latest
    hookDeletePolicy: before-hook-creation,hook-succeeded
    ttlSecondsAfterFinished: 600
  # Rendered 1:1 into the agent's config file (certoagent.env).
  config:
    natsUrl: nats://cx-ve-nats.edc-v.svc.cluster.local:4222
    # The platform's CFM KV bucket and activity stream
    bucket: cfm-bucket
    stream: cfm-stream
    # Certo's in-cluster management API base URL (the agent appends /management/v1/...).
    # Service name is release-derived: <release>-certo.
    certoUrl: http://cx-ve-certo.edc-v.svc.cluster.local:8080
    tokenExchangeUrl: http://jwtlet.edc-v.svc.cluster.local:8080
    # jwtlet participant-token audience (client_audience / bound_audiences)
    tokenExchangeAudience: edcv

# ---- Compliance Tracker (CFM lifecycle agent, built from this repo) ---------------------------
# Durable JetStream consumer on the platform's edc-events stream: receives EDC lifecycle
# CloudEvents and tracks participant compliance from them. Source lives in compliance-tracker/;
# the image is published by .github/workflows/publish.yml.
#
# Runs under the platform's "cfm-agents" ServiceAccount — the identity the platform already
# provisions for CFM agents (Vault role nats-cfm-agents, seed at secret/nats/cfm-agents, and a
# NATS user permitted to subscribe to "events.>"). Nothing to seed from this release.
complianceTracker:
  enabled: true
  # Keep at 1: additional replicas would join the same durable consumer and split the event
  # stream between them, so any per-participant state the compliance rules build would be partial.
  replicas: 1
  image:
    repository: ghcr.io/metaform/cx-ve/compliance-tracker
    tag: latest
    pullPolicy: IfNotPresent
  # Runtime mode passed as --mode: development | production | debug
  mode: debug
  resources: {}
  # NKey auth for the agent's NATS connection. Identical to certoAgent.natsAuth — both reuse the
  # platform-provisioned cfm-agents component, so the init container only fetches a ready-made
  # seed and there is nothing to seed from this release.
  natsAuth:
    # NATS auth switch 3 of 6 — see the NATS authentication block at the top of this file. Set to
    # false only together with switches 1, 2 and 4-6; leaving it true while switch 1 is false parks the pod
    # in Init:0/1 forever.
    enabled: true
    vaultUrl: http://cx-ve-vault.edc-v.svc.cluster.local:8200
    vaultRole: nats-cfm-agents
    vaultSecretPath: secret/nats/cfm-agents
    image: hashicorp/vault:latest
  # Rendered 1:1 into the agent's config file (compliancetracker.env).
  config:
    natsUrl: nats://cx-ve-nats.edc-v.svc.cluster.local:4222
    # cfm-bucket is NOT interchangeable: the cfm-agents NATS user may only touch
    # $KV.cfm-bucket.>, and the lifecycle-agent framework opens the KV bucket on connect.
    bucket: cfm-bucket
    # The platform's EDC event stream (subjects "events.>"), created by its nats-bootstrap job.
    # NOT cfm-stream — that carries the provision-manager activity messages the certo agent
    # consumes. The agent binds to the existing stream and fails fast if it is absent.
    stream: edc-events
    # Optional. Empty => the agent's compiled-in launcher.DefaultSubjects
    # ("events.issuance.>", "events.keypair.>"). Anything set here is MERGED with those, not
    # substituted, and NATS rejects a consumer whose filter subjects overlap — so an entry like
    # "events.>" or a leaf of an existing default fails at startup. Narrow the subscription in
    # launcher.DefaultSubjects instead.
    subjects: []
    # The event ledger: every received event is persisted here (the stream itself is memory
    # storage with interest retention, so this database is the durable record). REQUIRED — the
    # agent fails fast without it. The `event_tracker` database is provisioned by the platform's
    # postgres-init job from the postgresql.databases list above (its CX-VE-specific entry).
    postgresDsn: postgres://event_tracker:event_tracker@cx-ve-postgresql.edc-v.svc.cluster.local:5432/event_tracker?sslmode=disable
