## Registers this app's ServiceAccount in JWTlet so the pod's projected SA token can be exchanged
## (RFC 8693) for management-API- and certo-scoped tokens. Mirrors the membership-hub chart's
## jwtlet seed, but seeds TWO mappings for the one SA — one per participantContext the app
## exchanges under (`issuer` for the management API, `sudo` for certo). The scope mappings
## themselves (`admin`, `certo-mgmt-api:*`) are seeded by the platform / certo seed jobs; this
## job only registers the SA. Creating a mapping is idempotent (409 = already exists).
{{- if .Values.jwtlet.seed.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "verification-ui.fullname" . }}-jwtlet-seed
  labels:
    {{- include "verification-ui.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    # Weight 240: in the umbrella release all subcharts share one hook space — the platform's
    # seeds run at 10/20, the catenax-profile ones at 110-130, the onboarding-api mapping at 200,
    # the certo seeds at 210/220 and the membership-hub mapping at 230. This job only needs
    # jwtlet up, but a deterministic late slot keeps the ordering obvious.
    "helm.sh/hook-weight": "240"
    "helm.sh/hook-delete-policy": {{ .Values.jwtlet.seed.hookDeletePolicy | quote }}
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: {{ .Values.jwtlet.seed.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        app: {{ include "verification-ui.fullname" . }}-jwtlet-seed
    spec:
      # must act under the "seed-jobs" SA, so that JWTlet's management API can be accessed
      serviceAccountName: seed-jobs
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-jwtlet
          image: {{ .Values.jwtlet.seed.image }}
          command:
            - sh
            - -c
            - |
              until curl -sf {{ .Values.jwtlet.healthUrl | quote }}; do
                echo "Waiting for jwtlet to be ready..."
                sleep 5
              done
              echo ""
              echo "JWTlet is ready!"
      containers:
        - name: seed-jwtlet
          image: {{ .Values.jwtlet.seed.image }}
          env:
            - name: JWTLET_MGMT_URL
              value: {{ .Values.jwtlet.mgmtUrl | quote }}
          volumeMounts:
            - name: jwtlet-subject-token
              mountPath: /var/run/secrets/jwtlet
              readOnly: true
          command:
            - sh
            - -c
            - |
              set -e

              # Projected service account token used to authenticate against the jwtlet management API.
              TOKEN=$(cat /var/run/secrets/jwtlet/token)
              if [ -z "$TOKEN" ]; then
                echo "ERROR: subject token at /var/run/secrets/jwtlet/token is empty"
                exit 1
              fi

              # POSTs a JSON body to the jwtlet management API and handles the response:
              # 409 = already exists (fine, seeding is idempotent), >= 400 = fail the job.
              create() {
                desc="$1"; url="$2"; body="$3"
                echo "Creating ${desc}"
                resp=$(curl -s -w "\n%{http_code}" -X POST "${url}" \
                  -H "Authorization: Bearer ${TOKEN}" \
                  -H "Content-Type: application/json" \
                  -d "${body}")
                status=$(printf '%s\n' "$resp" | tail -1)
                if [ "$status" -eq 409 ]; then
                  echo "${desc} already exists"
                elif [ "$status" -ge 400 ]; then
                  echo "ERROR: Failed to create ${desc} (HTTP $status): $(printf '%s\n' "$resp" | sed '$d')"
                  exit 1
                else
                  echo "${desc} created"
                fi
              }
              {{- range .Values.jwtlet.seed.mappings }}

              create "mapping ({{ .participantContext }}) for the '{{ $.Values.serviceAccount.name }}' SA" \
                "${JWTLET_MGMT_URL}/mappings" \
                '{
                    "clientIdentifier": "system:serviceaccount:{{ $.Release.Namespace }}:{{ $.Values.serviceAccount.name }}",
                    "participantContext": {{ .participantContext | quote }},
                    "scopes": {{ .scopes | toJson }},
                    "audiences": {{ $.Values.jwtlet.seed.audiences | toJson }}
                }'
              {{- end }}

      volumes:
        # RFC 8693 subject_token used to authenticate against the jwtlet management API.
        # Audience must match jwtlet's `client_audience`.
        - name: jwtlet-subject-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: {{ .Values.jwtlet.subjectTokenAudience | quote }}
                  expirationSeconds: {{ .Values.jwtlet.subjectTokenExpirationSeconds }}
{{- end }}
