apiVersion: v2
name: decadex-profile
description: >-
  Dataspace-specific seeding for DECADE-X, the counterpart of the catenax-profile: the issuer's
  DX_LegalEntity_VC and DX_Site_VC definitions, and the EDC dataspace profile DECADE-X's DSP messages
  run under (its trusted issuers and the DCP scope that asks for the Legal Entity VC). Used by the VE
  and by a DECADE-X vendor stack.
type: application
version: 0.1.0
appVersion: "0.1.0"
