# The DECADE-X DSP profile: the EDC DataspaceProfile DECADE-X's DSP messages run under. Its name is
# the last segment of a DECADE-X participant's DSP address (/api/dsp/<pcid>/<name>) and the
# `protocol` of its catalog, negotiation and transfer requests. Every participant dialling one of
# the other's must use the same name: the VE (membership-hub dataspaces.decade-x.dataspace-profiles,
# verification-ui verification.dataspaces.decade-x.dsp-profile) and a vendor stack.
dspProfile: decade-x

issuer:
  # The issuer this platform runs — trusted under the profile. On the VE it also issues the
  # DECADE-X credentials (seedJobs.issuerCredentials). Host-derived: the install scripts override it.
  did: "did:web:issuer.cxve.localhost:issuer"
  # Further issuers trusted under the profile — on a vendor stack, the VE's issuer.
  trustedIssuers: []
  # The issuer's participant context: where the credential definition is created, and the jwtlet
  # mapping the seeds exchange their token under.
  participantContextId: issuer

# The DECADE-X credentials, as the issuer defines them (dx-onboarding-api/examples/credentials
# shows what they look like): the DX_LegalEntity_VC, whose credentialSubject.partner is the member's
# legal entity — its partnerID the DECADE-X-ID — and the DX_Site_VC, whose partner is the member's
# first business site, owned by that legal entity. Both copy their partner whole from a holder
# property the dx-onboarding-api registers (`holderProperty`), and credentialSubject.type
# (dx:Wallet) from `dxSubjectType`. The dx-onboarding-api's
# issuer-service.credential-definitions.legal-entity and .site must name the `id`s.
#
# The types keep the examples' compact `dx:` IRIs: matched literally — by the DCP scope, the wallet's
# query and the flow-token claim mapping — they need no JSON-LD context defining `dx` at the top
# level (the issuer can only add context URLs there; each partner carries its own context).
credentialDefinitions:
  legalEntity:
    id: dx-legal-entity-credential-def
    credentialType: "dx:DX_LegalEntity_VC"
    holderProperty: dxLegalEntity
    # a placeholder, like the catenax-profile's: no DECADE-X credential schema exists yet
    jsonSchemaUrl: https://example.com/schema/dx-legal-entity-vc.json
  site:
    id: dx-site-credential-def
    credentialType: "dx:DX_Site_VC"
    holderProperty: dxSite
    jsonSchemaUrl: https://example.com/schema/dx-site-vc.json
# Common to both: the holder attestation turning the registered properties into claims, the
# format — VC 2.0 (validFrom/validUntil) as the examples are, enveloped in a JOSE JWT — and the
# validity, one week like the Catena-X credentials'.
credentialAttestationId: decadex-holder-attestation-def
credentialFormat: VC2_0_JOSE
credentialValidity: "604800"

# In-cluster endpoints of the platform the seeds run against (release namespace).
services:
  issuerService: issuerservice
  controlPlane: controlplane
  jwtlet: jwtlet
  clusterDomain: svc.cluster.local
tokenExchangeAudience: edcv

seedJobs:
  # the platform SA with jwtlet mappings for the issuer context (read/write/admin)
  serviceAccountName: seed-jobs
  image: curlimages/curl:latest
  hookDeletePolicy: before-hook-creation,hook-succeeded
  ttlSecondsAfterFinished: 600
  subjectTokenAudience: https://kubernetes.default.svc.cluster.local
  subjectTokenExpirationSeconds: 3600
  # The issuer's credential definition — only where this platform's issuer issues the credential
  # (the VE); a vendor stack's issuer issues nothing.
  issuerCredentials:
    enabled: true
  # The EDC dataspace profile and its DCP scope — on every platform with DECADE-X participants.
  edcSeed:
    enabled: true
