## DECADE-X's EDC dataspace profile — the counterpart of the catenax-profile's edc-seed: the DSP
## profile DECADE-X participants are deployed with and dial each other under. Its DCP scope asks
## every counterparty for its DecadeXMembershipCredential, the way Catena-X's cx-neptune asks for
## the three Catena-X credentials — which is why DECADE-X cannot share cx-neptune: a DECADE-X
## participant holds none of those, and a presentation missing a requested credential is refused.
## No policy vocabulary (CEL expressions) yet: DECADE-X offers carry no constraints.
{{- if .Values.seedJobs.edcSeed.enabled }}
{{- $management := printf "http://%s:8081/api/mgmt/v5" (include "decadex.fqdn" (dict "svc" .Values.services.controlPlane "ctx" .)) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: decadex-edc-seed
  labels:
    app: decadex-edc-seed
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    # Weight 150: after the catenax-profile's EDC seed (130) and the DECADE-X issuer seed (140).
    "helm.sh/hook-weight": "150"
    "helm.sh/hook-delete-policy": {{ .Values.seedJobs.hookDeletePolicy | quote }}
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: {{ .Values.seedJobs.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        app: decadex-edc-seed
    spec:
      serviceAccountName: {{ .Values.seedJobs.serviceAccountName }}
      restartPolicy: OnFailure
      initContainers:
        # any HTTP answer (401 included) means the management API is up
        - name: wait-for-edc
          image: {{ .Values.seedJobs.image }}
          command:
            - sh
            - -c
            - |
              until curl -s -o /dev/null "{{ $management }}/dataspaceprofiles"; do
                echo "Waiting for the EDC control plane's management API..."
                sleep 5
              done
      containers:
        - name: seed
          image: {{ .Values.seedJobs.image }}
          env:
            - name: MANAGEMENT
              value: {{ $management | quote }}
            - name: TOKEN_SCOPE
              value: admin
          volumeMounts:
            - name: jwtlet-subject-token
              mountPath: /var/run/secrets/jwtlet
              readOnly: true
          command:
            - sh
            - -c
            - |
              set -e
              {{- include "decadex.exchangeToken" . | nindent 14 }}
              {{- include "decadex.createFn" . | nindent 14 }}

              # The profile is upserted — POST, and PUT on 409 — so its trusted issuers follow the
              # values on an upgrade instead of keeping the first install's.
              PROFILE=$(cat <<'JSON'
              {
                "@context": ["https://w3id.org/edc/connector/management/v2"],
                "@type": "DataspaceProfile",
                "name": {{ .Values.dspProfile | quote }},
                "protocol": {
                  "version": "2025-1",
                  "binding": "https",
                  "namespace": "https://w3id.org/dspace/2025/1/"
                },
                "jsonLdContextsUrl": [
                  "https://w3id.org/dspace/2025/1/context.jsonld",
                  "https://w3id.org/edc/dspace/v0.0.1"
                ],
                "trustedIssuers": {{ include "decadex.trustedIssuers" . }}
              }
              JSON
              )
              resp=$(curl -s -w "\n%{http_code}" -X POST "${MANAGEMENT}/dataspaceprofiles" \
                -H "Authorization: Bearer ${TOKEN}" -H "Content-Type: application/json" --data "$PROFILE")
              status=$(printf '%s\n' "$resp" | tail -1)
              if [ "$status" -eq 409 ]; then
                resp=$(curl -s -w "\n%{http_code}" -X PUT "${MANAGEMENT}/dataspaceprofiles" \
                  -H "Authorization: Bearer ${TOKEN}" -H "Content-Type: application/json" --data "$PROFILE")
                status=$(printf '%s\n' "$resp" | tail -1)
                [ "$status" -lt 400 ] || { echo "ERROR: updating the dataspace profile failed (HTTP $status): $(printf '%s\n' "$resp" | sed '$d')"; exit 1; }
                echo "dataspace profile {{ .Values.dspProfile }} updated"
              elif [ "$status" -ge 400 ]; then
                echo "ERROR: creating the dataspace profile failed (HTTP $status): $(printf '%s\n' "$resp" | sed '$d')"
                exit 1
              else
                echo "dataspace profile {{ .Values.dspProfile }} created"
              fi

              create "the DCP scope for the {{ .Values.credentialDefinition.credentialType }}" "${MANAGEMENT}/dcpscopes" <<'JSON'
              {
                "@context": ["https://w3id.org/edc/connector/management/v2"],
                "@type": "DcpScope",
                "@id": "decadex-membership-scope",
                "value": "org.eclipse.dspace.dcp.vc.type:{{ .Values.credentialDefinition.credentialType }}:read",
                "profile": {{ .Values.dspProfile | quote }}
              }
              JSON
      volumes:
        {{- include "decadex.tokenVolume" . | nindent 8 }}
{{- end }}
