## The DecadeXMembershipCredential's definition on the issuer — the counterpart of the
## catenax-profile's issuer-credentials-seed. The dx-onboarding-api registers approved
## participants as holders, with their DID (`id`) and DECADE-X-ID (`decadeXId`) as properties,
## and offers them this definition; the holder attestation turns those properties into the
## credential's claims. Idempotent: 409 = already exists.
{{- if .Values.seedJobs.issuerCredentials.enabled }}
{{- $issuerService := include "decadex.fqdn" (dict "svc" .Values.services.issuerService "ctx" .) }}
{{- $definition := .Values.credentialDefinition }}
apiVersion: batch/v1
kind: Job
metadata:
  name: decadex-issuer-credentials-seed
  labels:
    app: decadex-issuer-credentials-seed
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    # Weight 140: after the platform's seeds (10/20: the issuer context and the seed-jobs SA's
    # jwtlet mapping for it) and the catenax-profile's (110-130).
    "helm.sh/hook-weight": "140"
    "helm.sh/hook-delete-policy": {{ .Values.seedJobs.hookDeletePolicy | quote }}
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: {{ .Values.seedJobs.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        app: decadex-issuer-credentials-seed
    spec:
      serviceAccountName: {{ .Values.seedJobs.serviceAccountName }}
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-issuerservice
          image: {{ .Values.seedJobs.image }}
          command:
            - sh
            - -c
            - |
              until curl -sf "http://{{ $issuerService }}:10010/api/check/readiness"; do
                echo "Waiting for issuerservice to be ready..."
                sleep 5
              done
      containers:
        - name: seed
          image: {{ .Values.seedJobs.image }}
          env:
            - name: ADMIN_API
              value: "http://{{ $issuerService }}:10013/api/admin/v1/participants/{{ .Values.issuer.participantContextId }}"
            - name: TOKEN_SCOPE
              value: write
          volumeMounts:
            - name: jwtlet-subject-token
              mountPath: /var/run/secrets/jwtlet
              readOnly: true
          command:
            - sh
            - -c
            - |
              set -e
              {{- include "decadex.exchangeToken" . | nindent 14 }}
              {{- include "decadex.createFn" . | nindent 14 }}

              # The holder's registered properties are the claims — its own attestation,
              # independent of the catenax-profile's identical holder-attestation-def.
              create "the DECADE-X holder AttestationDefinition" "${ADMIN_API}/attestations" <<'JSON'
              {
                "attestationType": "holder",
                "configuration": {},
                "id": {{ $definition.attestationId | quote }}
              }
              JSON

              create "the {{ $definition.credentialType }} CredentialDefinition" "${ADMIN_API}/credentialdefinitions" <<'JSON'
              {
                "attestations": [{{ $definition.attestationId | quote }}],
                "credentialType": {{ $definition.credentialType | quote }},
                "id": {{ $definition.id | quote }},
                "jsonSchema": "{}",
                "jsonSchemaUrl": {{ $definition.jsonSchemaUrl | quote }},
                "mappings": [
                  {"input": "decadeXId", "output": "credentialSubject.decadeXId", "required": true},
                  {"input": "id", "output": "credentialSubject.id", "required": true}
                ],
                "rules": [],
                "format": "VC1_0_JWT",
                "validity": {{ $definition.validity | quote }}
              }
              JSON
      volumes:
        {{- include "decadex.tokenVolume" . | nindent 8 }}
{{- end }}
