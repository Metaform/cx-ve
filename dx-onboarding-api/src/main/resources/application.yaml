# Runtime configuration for the DECADE-X onboarding API (the TSP onboarding intake). Values here are the defaults baked
# into the image; every key can be overridden through environment variables or a mounted yaml file
# (SPRING_CONFIG_ADDITIONALLOCATION).

spring:
  application:
    name: dx-onboarding-api                                     # SPRING_APPLICATION_NAME
  # The onboarding API's document limit: 10 MB per file, one file per call (the request size leaves
  # room for the form fields). Resolved lazily, so an oversized upload is answered as a problem
  # (content-too-large) rather than before the controller is reached.
  servlet:
    multipart:
      max-file-size: 10MB                                       # SPRING_SERVLET_MULTIPART_MAXFILESIZE
      max-request-size: 11MB                                    # SPRING_SERVLET_MULTIPART_MAXREQUESTSIZE
      resolve-lazily: true                                      # SPRING_SERVLET_MULTIPART_RESOLVELAZILY
  # Bearer-JWT validation on /api/** against the VE's OSP IdP (Ory Hydra) — the same IdP the
  # Catena-X onboarding API trusts. issuer-uri is the expected `iss`: the IdP's EXTERNAL URL.
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://cx-ve-osp-idp.edc-v.svc.cluster.local:4444/.well-known/jwks.json  # SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI
          issuer-uri: http://cxve.localhost/auth/osp                                      # SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUERURI

# The IssuerService an approved participant is registered with as credential holder, and offered
# its DECADE-X credentials through — as the Catena-X onboarding API does. The admin API is called
# with a token exchanged under the token-resource jwtlet mapping, which must grant
# issuer-admin-api:admin (the chart's jwtlet seed registers it for this service's account).
issuer-service:
  url: http://issuerservice.edc-v.svc.cluster.local:10013/api/admin   # ISSUERSERVICE_URL
  issuer-context-id: issuer                                     # ISSUERSERVICE_ISSUERCONTEXTID
  token-resource: sudo                                          # ISSUERSERVICE_TOKENRESOURCE
  # Must exist at the issuer — the umbrella chart's DECADE-X issuer seed creates it; an unknown id
  # fails the whole offer.
  credential-definition-ids: decadex-membership-credential-def  # ISSUERSERVICE_CREDENTIALDEFINITIONIDS

# The onboarding lifecycle events (events.onboarding.started / .completed), published onto the
# platform's edc-events JetStream stream — what the compliance tracker follows a participant by.
# Off here, so the app runs without a broker; the chart turns it on, with the Vault-delivered NKey.
nats:
  enabled: false                                                # NATS_ENABLED
  url: nats://cx-ve-nats.edc-v.svc.cluster.local:4222           # NATS_URL
  nkey-seed-path: ""                                            # NATS_NKEYSEEDPATH

# This service's workload identity: the projected service-account token and the jwtlet it is
# exchanged at (RFC 8693).
token:
  file:
    path: /var/run/secrets/jwtlet/token                         # TOKEN_FILE_PATH
  exchange:
    url: http://jwtlet.edc-v.svc.cluster.local:8080             # TOKEN_EXCHANGE_URL
    audience: edcv                                              # TOKEN_EXCHANGE_AUDIENCE

springdoc:
  swagger-ui:
    path: /swagger                                              # SPRINGDOC_SWAGGERUI_PATH

dx-onboarding:
  # The header the dataspace's data plane stamps the calling connector's identity in; onboarding
  # requests are scoped to it. ASSUMPTION: the spec does not settle how the data plane passes the
  # identity on — a header is assumed, and trusted unverified (warned about at startup).
  connector-id-header: X-Connector-Id                           # DXONBOARDING_CONNECTORIDHEADER
  # A draft nobody changed for `ttl` is deleted with its documents, as the TSP does; expired drafts
  # are looked for every `purge-interval` (ISO-8601).
  drafts:
    ttl: 30d                                                    # DXONBOARDING_DRAFTS_TTL
    purge-interval: PT1H                                        # DXONBOARDING_DRAFTS_PURGEINTERVAL
  # At submit, legalEntity.preferredDid must resolve to its DID document: the participant's
  # resources, its DID among them, exist before it onboards, and its credentials are offered to the
  # CredentialService that document advertises. did:web only, fetched over `scheme` — http, as the
  # platform's runtimes resolve did:web (edc.iam.did.web.use.https=false). Switched off, a DID that
  # does not resolve only shows when the credential offer fails after approval.
  did-check:
    enabled: true                                               # DXONBOARDING_DIDCHECK_ENABLED
    scheme: http                                                # DXONBOARDING_DIDCHECK_SCHEME
    timeout: 5s                                                 # DXONBOARDING_DIDCHECK_TIMEOUT
  # How submitted onboarding requests are reviewed — there is no TSP operator in the VE yet, so a
  # request is approved automatically or waits in SUBMITTED. Participants HOSTED HERE (connector
  # identity under hosted-did-prefix: the verification participant, the e2e tests' participants)
  # are approved; EXTERNAL ones (systems under test) too, for now — switch that off to have them
  # wait for an operator's review.
  review:
    # The DID prefix the Membership Hub mints its participants' DIDs under (its
    # participant.did.template); host-derived: the install scripts override it for a non-default host.
    hosted-did-prefix: "did:web:identity.cxve.localhost:"     # DXONBOARDING_REVIEW_HOSTEDDIDPREFIX
    auto-approve:
      hosted: true                                              # DXONBOARDING_REVIEW_AUTOAPPROVE_HOSTED
      external: true                                            # DXONBOARDING_REVIEW_AUTOAPPROVE_EXTERNAL
    # How long an automatic approval waits after the submission (0: right away — still after the
    # submitting call returned SUBMITTED).
    delay: 0s                                                   # DXONBOARDING_REVIEW_DELAY
