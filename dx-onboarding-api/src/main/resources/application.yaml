# Runtime configuration for the Decade-X onboarding API (stub). Values here are the defaults baked
# into the image; every key can be overridden through environment variables or a mounted yaml file
# (SPRING_CONFIG_ADDITIONALLOCATION).

spring:
  application:
    name: dx-onboarding-api                                     # SPRING_APPLICATION_NAME
  # Bearer-JWT validation on /api/** against the VE's OSP IdP (Ory Hydra) — the same IdP the
  # Catena-X onboarding API trusts. issuer-uri is the expected `iss`: the IdP's EXTERNAL URL.
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://cx-ve-osp-idp.edc-v.svc.cluster.local:4444/.well-known/jwks.json  # SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI
          issuer-uri: http://cxve.localhost/auth/osp                                      # SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUERURI

springdoc:
  swagger-ui:
    path: /swagger                                              # SPRINGDOC_SWAGGERUI_PATH

dx-onboarding:
  # How long an application waits before it is decided — 0 decides right away (still off the
  # request thread, so the webhook may arrive before or after the submitting call returns).
  decision-delay: 0s                                            # DXONBOARDING_DECISIONDELAY
