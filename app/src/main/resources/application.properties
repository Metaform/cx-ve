spring.application.name=cx-ve
springdoc.swagger-ui.path=/swagger
logging.level.com.metaform.cxve=INFO
# NATS/JetStream issuance-event subscriber. Disabled by default; enable in deployed environments.
nats.enabled=true
nats.url=nats://core-platform-nats.edc-v.svc.cluster.local:4222
nats.stream=edc-events
nats.durable-name=onboarding-api
nats.subject-filter=events.issuance.>
# nats.nkey-seed-path=${PWD}/nats.nk
# token exchange configuration
token.file.path=${PWD}/token