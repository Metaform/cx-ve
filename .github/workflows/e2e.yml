name: E2E test

# End-to-end test of the Verification Environment (scripts/e2e.sh): installs the VE on a
# single kind cluster, onboards the Verification Participant, and verifies the participant's
# DID document resolves from outside the cluster through the gateway.

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: In-cluster End-To-End of the VE
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install kind
        uses: helm/kind-action@v1
        with:
          install_only: true

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Add Traefik chart repository
        run: helm repo add traefik https://traefik.github.io/charts

      # The scripts reach the gateway via cxve.localhost; make resolution deterministic
      # instead of relying on the resolver's *.localhost handling. The issuer./identity. names
      # are the VE's did:web hostnames — the e2e's external DID check resolves one of them from
      # this host, and listing them keeps that working the same way regardless of the tool
      # (curl short-circuits *.localhost internally; getent-based tools would otherwise
      # NXDOMAIN)
      - name: Resolve VE hostnames
        run: echo "127.0.0.1 cxve.localhost issuer.cxve.localhost identity.cxve.localhost" | sudo tee -a /etc/hosts

      - name: Run end-to-end test
        env:
          # Keep a failed cluster alive for the log-export step below; the runner is discarded
          # after the job, so no cleanup is needed here
          E2E_KEEP_CLUSTERS: "true"
        run: ./scripts/e2e.sh

      - name: Export kind cluster logs
        if: failure()
        run: kind export logs --name cxve logs/cxve || true

      - name: Upload cluster logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kind-logs
          path: logs/
          if-no-files-found: ignore
