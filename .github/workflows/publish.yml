name: Publish

on:
  push:
    branches:
      - main
    tags:
      - "**"

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: metaform/cx-ve/onboardingapi

jobs:
  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      # QEMU emulates arm64 for the runtime stage's RUN steps; the Gradle build and jar-extract
      # stages are pinned to $BUILDPLATFORM in the Dockerfile and run natively either way.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Determine image name
        id: image
        run: echo "name=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
            type=ref,event=tag

      - name: Build and optionally push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: onboarding-api
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm-chart:
    name: Publish Helm charts
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Compute OCI repository
        id: repo
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login "${REGISTRY}" \
              --username "${{ github.actor }}" \
              --password-stdin

      - name: Package charts
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          # App chart first, then the umbrella: helm dependency update vendors the local
          # onboarding-api chart (file://) plus the OCI dependencies into the umbrella package.
          helm lint charts/onboarding-api
          helm template charts/onboarding-api > /dev/null
          helm package charts/onboarding-api --destination dist --version "$version" --app-version "$version"
          helm dependency update charts/cx-ve
          helm lint charts/cx-ve
          helm template charts/cx-ve > /dev/null
          helm package charts/cx-ve --destination dist --version "$version" --app-version "$version"

      - name: Push charts to GHCR
        run: |
          for pkg in dist/*.tgz; do
            helm push "$pkg" "oci://${REGISTRY}/${{ steps.repo.outputs.owner }}/charts"
          done

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.ref }}
          generate_release_notes: true
